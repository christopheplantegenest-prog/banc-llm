# Banc d'essai llama.cpp — construction de l'APK de test (armeabi-v7a uniquement)
# Déclencheurs : envoi du colis banc-sources.zip, ou bouton « Run workflow »
# (où l'on peut choisir une autre version de llama.cpp sans rien modifier).

name: Construire le banc d'essai

on:
  push:
    paths:
      - 'banc-sources.zip'
      - '.github/workflows/construire.yml'
  workflow_dispatch:
    inputs:
      version_llama:
        description: 'Version de llama.cpp (étiquette, ex. b6100)'
        required: false
        default: 'b6100'

permissions:
  contents: write

concurrency:
  group: banc
  cancel-in-progress: false

env:
  VERSION_LLAMA: ${{ github.event.inputs.version_llama || 'b6100' }}

jobs:
  apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Déballer les sources
        run: |
          set -euo pipefail
          test -f banc-sources.zip || { echo "::error::banc-sources.zip est absent à la racine du dépôt"; exit 1; }
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o banc-sources.zip -d "$RUNNER_TEMP/src"
          ls -R "$RUNNER_TEMP/src" | head -40
          echo "NDK : ${ANDROID_NDK_LATEST_HOME:-absent}"

      - name: Récupérer llama.cpp (${{ env.VERSION_LLAMA }})
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$VERSION_LLAMA" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" log -1 --format='%H %cd'

      - name: Compiler la bibliothèque native (armeabi-v7a, NEON, sans dotprod/i8mm)
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -S "$RUNNER_TEMP/src/native" -B "$RUNNER_TEMP/natif" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_ARM_NEON=ON \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_DIR="$RUNNER_TEMP/llama.cpp" 2>&1 | tee "$RUNNER_TEMP/journal-natif.txt"
          cmake --build "$RUNNER_TEMP/natif" --target banc -j 4 2>&1 | tee -a "$RUNNER_TEMP/journal-natif.txt"
          mkdir -p "$RUNNER_TEMP/src/android/app/src/main/jniLibs/armeabi-v7a"
          cp "$RUNNER_TEMP/natif/libbanc.so" "$RUNNER_TEMP/src/android/app/src/main/jniLibs/armeabi-v7a/"
          file "$RUNNER_TEMP/natif/libbanc.so"
          # Contrôle : aucune instruction dotprod/i8mm ne doit être exigée (32 bits de toute façon)
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -A "$RUNNER_TEMP/natif/libbanc.so" | grep -iE 'Tag_CPU_arch|Tag_Advanced_SIMD|Tag_FP_arch' || true

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire l'APK
        env:
          NUMERO_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export BANC_CLE="$RUNNER_TEMP/src/signature/banc.jks"
          cd "$RUNNER_TEMP/src/android"
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/journal-gradle.txt"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/banc-llm-armv7.apk"
          ls -la "$RUNNER_TEMP/banc-llm-armv7.apk"
          unzip -l "$RUNNER_TEMP/banc-llm-armv7.apk" | grep -E 'lib/' || true

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ETIQUETTE="banc-${{ github.run_number }}"
          gh release create "$ETIQUETTE" "$RUNNER_TEMP/banc-llm-armv7.apk" \
            --title "Banc LLM n°${{ github.run_number }} (llama.cpp $VERSION_LLAMA)" \
            --notes "APK de test armeabi-v7a — llama.cpp $VERSION_LLAMA."
          {
            echo "# État du banc d'essai"
            echo
            echo "✅ Construction n°${{ github.run_number }} réussie (llama.cpp $VERSION_LLAMA)."
            echo
            echo "APK : https://github.com/${{ github.repository }}/releases/tag/$ETIQUETTE"
          } > ETAT-BANC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETAT-BANC.md
          git commit -m "État du banc : réussite n°${{ github.run_number }} [skip ci]"
          git push

      - name: Signaler l'échec
        if: failure()
        run: |
          {
            echo "# État du banc d'essai"
            echo
            echo "❌ Construction n°${{ github.run_number }} en échec (llama.cpp $VERSION_LLAMA)."
            echo
            echo "## Fin du journal natif"
            echo '```'
            grep -iE 'error|erreur|fatal' "$RUNNER_TEMP/journal-natif.txt" 2>/dev/null | head -25 || true
            tail -n 25 "$RUNNER_TEMP/journal-natif.txt" 2>/dev/null || echo "(pas de journal natif)"
            echo '```'
            echo
            echo "## Fin du journal Gradle"
            echo '```'
            grep -iE 'error|FAILURE|What went wrong' -A3 "$RUNNER_TEMP/journal-gradle.txt" 2>/dev/null | head -30 || true
            tail -n 15 "$RUNNER_TEMP/journal-gradle.txt" 2>/dev/null || echo "(pas de journal Gradle)"
            echo '```'
          } > ETAT-BANC.md
          cat ETAT-BANC.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETAT-BANC.md
          git commit -m "État du banc : échec n°${{ github.run_number }} [skip ci]" || true
          git push || true
